name: Release plugin

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag, without a v prefix (for example, 5.0.3)"
        required: true
        type: string
      publish:
        description: "Publish the release immediately (otherwise create a draft)"
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PUBLISH_RELEASE: ${{ github.event_name == 'push' || inputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Validate release version
        run: node scripts/check-version.mjs "$RELEASE_TAG"

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run build
      - run: pnpm run check:build

      - name: Attest plugin assets
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create or update release
        shell: bash
        run: |
          assets=(main.js manifest.json)
          if [ -f styles.css ]; then
            assets+=(styles.css)
          fi
          node --input-type=module -e "import { readFileSync, writeFileSync } from 'node:fs'; const section = readFileSync('CHANGELOG.md', 'utf8').split(/^# /m).find(part => part.startsWith(process.env.RELEASE_TAG + '\n') || part.startsWith(process.env.RELEASE_TAG + '\r\n')); if (!section) throw new Error('Missing changelog entry'); writeFileSync('release-notes.md', section.slice(section.indexOf('\n') + 1).trim() + '\n');"
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            node -e "if (!JSON.parse(require('fs').readFileSync('release-state.json', 'utf8')).isDraft) { console.error('Refusing to replace assets of a published release.'); process.exit(1); }"
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag --draft --title "$RELEASE_TAG" --notes-file release-notes.md
          fi
          if [ "$PUBLISH_RELEASE" = "true" ]; then
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
